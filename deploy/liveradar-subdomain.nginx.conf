server {
    listen 80;
    server_name liveradar.bugtuisan.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/LiveRadar;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name liveradar.bugtuisan.com;

    ssl_certificate /etc/letsencrypt/live/liveradar.bugtuisan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liveradar.bugtuisan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        auth_basic "开播雷达";
        auth_basic_user_file /etc/liveradar/htpasswd;

        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
